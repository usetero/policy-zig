version: "3"

tasks:
  default:
    desc: Build the library
    cmds:
      - zig build

  build:
    desc: Build with the selected optimization mode
    cmds:
      - zig build -Doptimize={{.OPTIMIZE | default "Debug"}}

  build:release:
    desc: Build in ReleaseFast mode
    cmds:
      - zig build -Doptimize=ReleaseFast

  build:protos:
    desc: Regenerate provider protobuf declarations
    cmds:
      - zig build -Dgen-proto=true gen-proto

  test:
    desc: Run the complete test suite
    cmds:
      - zig build test -Doptimize=ReleaseSafe --summary all

  bench:
    desc: Benchmark compiled-image evaluation and OTel sampling
    cmds:
      - zig build bench

  bench:counters:
    desc: Capture hardware performance counters
    cmds:
      - scripts/perf-counters.sh

  check:kernel:
    desc: Fail if the linked evaluator spans an instruction page
    cmds:
      - zig build check-kernel

  report:stack:
    desc: Capture evaluator stack reports for release modes
    cmds:
      - scripts/stack-report.sh

  format:
    desc: Format handwritten Zig sources
    cmds:
      - zig fmt src build.zig

  format:check:
    desc: Check Zig formatting
    cmds:
      - zig fmt --check src build.zig

  lint:zig:
    desc: Run ziglint on handwritten Zig sources
    cmds:
      - |
        if ! command -v ziglint >/dev/null 2>&1; then
          echo "ziglint is required before merge" >&2
          exit 1
        fi
        ziglint

  lint:
    desc: Run all pre-merge lint checks
    cmds:
      - task: format:check
      - task: lint:zig

  check:
    desc: Build without running tests or benchmarks
    cmds:
      - zig build --summary failures

  clean:
    desc: Remove local Zig build artifacts
    cmds:
      - rm -rf zig-out zig-cache .zig-cache

  ci:setup:
    desc: Verify required development tools
    cmds:
      - zig version
      - ziglint --version

  signoff:
    desc: Run formatting, lint, tests, and architecture checks
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: check:kernel
      - task: report:stack
